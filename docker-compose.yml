services:
  app:
    build: .
    container_name: fornsok-boulder-finder
    restart: unless-stopped
    ports:
      - "3250:3250"
    env_file:
      - .env
    environment:
      PORT: "3250"
      HOST: "0.0.0.0"
      # Trust nginx proxy headers (set ORIGIN to your public URL if preferred)
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # ORIGIN: https://boulder.example.com

  matomo-db:
    image: mariadb:lts
    container_name: fornsok-matomo-db
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:?Set MATOMO_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:?Set MATOMO_DB_ROOT_PASSWORD in .env}
    volumes:
      - matomo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  matomo:
    image: matomo:5
    container_name: fornsok-matomo
    restart: unless-stopped
    depends_on:
      matomo-db:
        condition: service_healthy
    ports:
      - "3251:80"
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:?Set MATOMO_DB_PASSWORD in .env}
      MATOMO_DATABASE_DBNAME: matomo
      PUBLIC_MATOMO_URL: ${PUBLIC_MATOMO_URL:-}
      MATOMO_PUBLIC_HOST: ${MATOMO_PUBLIC_HOST:-}
    volumes:
      - matomo_html:/var/www/html
      - ./matomo/common.config.ini.php:/var/www/html/config/common.config.ini.php:ro
      - ./matomo/start.sh:/matomo-start.sh:ro
    command: ["/bin/sh", "/matomo-start.sh"]

  matomo-cron:
    image: matomo:5
    container_name: fornsok-matomo-cron
    restart: unless-stopped
    depends_on:
      matomo:
        condition: service_started
    volumes:
      - matomo_html:/var/www/html
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          php /var/www/html/console core:archive --url=http://matomo/ || true
          sleep 3600
        done

volumes:
  matomo_db:
  matomo_html:
